<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books JSON Test</title>
  </head>
  <body>
    <script>
      const bookData = {
        books: [
          {
            title: "The Great Gatsby",
            author: "F. Scott Fitzgerald",
            publicationYear: 1925,
            genres: ["Fiction", "Classics"],
          },
          {
            title: "To Kill a Mockingbird",
            author: "Harper Lee",
            publicationYear: 1960,
            genres: ["Fiction", "Coming-of-Age"],
          },
        ],
      };

      // Display the title of the first book
      console.log(bookData.books[0].title);

      // Display the author of the second book
      console.log(bookData.books[1].author);

      // Loop through all books and display the genres
      bookData.books.forEach((book) => {
        console.log(book.genres);
      });
    </script>
  </body>
</html>
